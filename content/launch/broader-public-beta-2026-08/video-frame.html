<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>True North Map walkthrough frame</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #f7f7f3; }
      body { color: #242827; font-family: Inter, Arial, sans-serif; }
      main { position: relative; width: 100%; height: 100%; }
      .screen { position: absolute; inset: 0 0 210px; display: flex; align-items: center; justify-content: center; background: #f7f7f3; }
      .screen img { width: 100%; height: 100%; object-fit: contain; object-position: top center; }
      .caption { position: absolute; inset: auto 0 0; height: 220px; padding: 36px 90px 30px; color: #ffffff; background: #242827; border-top: 6px solid #f5e900; }
      h1 { margin: 0; font-family: "Barlow ExtraBold", "Arial Black", Arial, sans-serif; font-size: 58px; line-height: 1; letter-spacing: -0.025em; }
      p { margin: 20px 0 0; color: #f5e900; font-size: 30px; line-height: 1.2; }
      .mark { position: absolute; right: 78px; top: 45px; width: 220px; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <div class="screen"><img id="screen" alt="" /></div>
      <section class="caption">
        <img class="mark" src="../../../app/public/brand/true-north-map-horizontal-light.svg" alt="" />
        <h1 id="headline"></h1>
        <p id="support"></p>
      </section>
    </main>
    <script>
      const scenes = [
        ["screenshots/homepage-desktop.png", "Canada is building more than most people can see.", "Make Canadian capability visible."],
        ["screenshots/missions-desktop.png", "Start with the mission.", "Explore reviewed use cases before choosing a company."],
        ["screenshots/map-explorer-desktop.png", "See the national ecosystem in one view.", "Map, table and filters stay synchronized."],
        ["screenshots/organization-kraken-desktop.png", "Follow the record from company to technology.", "See what is sourced, assessed, current or still unknown."],
        ["screenshots/public-need-detail-desktop.png", "Move from public needs to possible Canadian fits.", "Reviewed assessments do not imply procurement status."],
        ["screenshots/defence-brief-detail-desktop.png", "Start a better-informed conversation.", "Explore True North Map at truenorthmap.ca."]
      ];
      const index = Math.max(0, Math.min(scenes.length - 1, Number(new URLSearchParams(location.search).get("scene")) - 1));
      const [src, headline, support] = scenes[index];
      document.querySelector("#screen").src = src;
      document.querySelector("#headline").textContent = headline;
      document.querySelector("#support").textContent = support;
    </script>
  </body>
</html>
